services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks: [capstone-net]

  api-gateway:
    build:
      context: ./api-gateway
    environment:
      APP_ENV: ${APP_ENV:-development}
      AGENT_SERVICE_URL: http://agent-service:8001
      GOOGLE_OAUTH_CLIENT_SECRETS_FILE: /run/secrets/gmail/oauth-client.json
      GOOGLE_TOKEN_FILE: /var/lib/gmail-capstone/token.json
      GMAIL_REDIRECT_URI: http://localhost:8000/gmail/oauth/callback
    volumes:
      - "H:/gmail-capstone-secrets:/run/secrets/gmail:ro"
      - "H:/gmail-capstone-data:/var/lib/gmail-capstone"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [capstone-net]

  agent-service:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    environment:
      PYTHONPATH: /app
      WEAVIATE_URL: http://weaviate:8080
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_CHAT_MODEL: qwen3:8b
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [capstone-net]

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.6
    ports:
      - "127.0.0.1:${WEAVIATE_HTTP_PORT:-8081}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50051}:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks: [capstone-net]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    networks: [capstone-net]

networks:
  capstone-net:
    driver: bridge

volumes:
  weaviate_data:
