server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /cleanup/ {
        proxy_pass http://api-gateway:8000/cleanup/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /rag/ {
        proxy_pass http://api-gateway:8000/rag/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /gmail/ {
        proxy_pass http://api-gateway:8000/gmail/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /health {
        proxy_pass http://api-gateway:8000/health;
        proxy_set_header Host $host;
    }
}
